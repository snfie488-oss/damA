    const [recentSearches, setRecentSearches] = useState([]);
    const [searchSubmitted, setSearchSubmitted] = useState(false);
    const totalSavings = useMemo(() => savingsHistory.reduce((s, h) => s + h.amount, 0), [savingsHistory]);
    const todaySavings = useMemo(() => {
        const today = todayStr();
        return savingsHistory.filter((h) => h.date === today && (!h.ts || new Date(h.ts).toDateString() === new Date().toDateString())).reduce((s, h) => s + h.amount, 0);
    }, [savingsHistory]);
    useEffect(() => {
        if (screen === "splash") {
            const t = setTimeout(() => goRoot("home"), 2000);
            return () => clearTimeout(t);
        }
    }, [screen, goRoot]);
    const [profile, setProfile] = useState(null);
    const [points, setPoints] = useState(0);
    const [lastEarned, setLastEarned] = useState({ add: 0, note: "" });
    const [adOpen, setAdOpen] = useState(false);
    const [adWatch, setAdWatch] = useState({ day: "", count: 0 });
    const [earnedToday, setEarnedToday] = useState({ day: "", amt: 0 });
    const [avatarItems, setAvatarItems] = useState({});
    const [nowTick, setNowTick] = useState(Date.now());
    useEffect(() => { const t = setInterval(() => setNowTick(Date.now()), 30000); return () => clearInterval(t); }, []);
    const [notifications, setNotifications] = useState([]);
    const pushNotif = (text, kind = "info") => setNotifications((prev) => [{ id: `${Date.now()}-${Math.random()}`, text, kind, ts: Date.now(), read: false }, ...prev].slice(0, 100));
    const markAllRead = () => setNotifications((prev) => (prev.some((n) => !n.read) ? prev.map((n) => ({ ...n, read: true })) : prev));
    const unread = notifications.filter((n) => !n.read).length;
    const [withdrawAccounts, setWithdrawAccounts] = useState([]);
    const [depositAccounts, setDepositAccounts] = useState([]);
    const [loaded, setLoaded] = useState(false);
    useEffect(() => {
        (async () => {
            try {
                const r = await window.storage.get("app-state", false);
                const d = JSON.parse(r.value);
                if (Array.isArray(d.savingsHistory))
                    setSavingsHistory(d.savingsHistory);
                if (typeof d.goalName === "string")
                    setGoalName(d.goalName);
                if (typeof d.goalAmount === "number")
                    setGoalAmount(d.goalAmount);
                if (typeof d.goalCurrent === "number")
                    setGoalCurrent(d.goalCurrent);
                if (typeof d.userName === "string")
                    setUserName(d.userName);
                if (Array.isArray(d.withdrawAccounts))
                    setWithdrawAccounts(normalizePrimary(d.withdrawAccounts));
                if (Array.isArray(d.depositAccounts))
                    setDepositAccounts(normalizePrimary(d.depositAccounts));
                if (Array.isArray(d.notifications))
                    setNotifications(d.notifications);
                if (d.profile && typeof d.profile === "object")
                    setProfile(d.profile);
                if (typeof d.points === "number")
                    setPoints(d.points);
                if (d.adWatch && typeof d.adWatch === "object")
                    setAdWatch(d.adWatch);
                if (d.earnedToday && typeof d.earnedToday === "object")
                    setEarnedToday(d.earnedToday);
                if (d.avatarItems && typeof d.avatarItems === "object")
                    setAvatarItems(d.avatarItems);
            }
            catch (e) { }
            setLoaded(true);
        })();
    }, []);
    useEffect(() => {
        if (!loaded)
            return;
        try {
            window.storage.set("app-state", JSON.stringify({ savingsHistory, goalName, goalAmount, goalCurrent, userName, withdrawAccounts, depositAccounts, notifications, profile, points, earnedToday, avatarItems, adWatch }), false);
        }
        catch (e) { }
    }, [loaded, savingsHistory, goalName, goalAmount, goalCurrent, userName, withdrawAccounts, depositAccounts, notifications, profile, points, earnedToday, avatarItems, adWatch]);
    useEffect(() => {
        (async () => {
            try {
                const r = await window.storage.get("recent-searches", false);
                if (r)
                    setRecentSearches(JSON.parse(r.value));
            }
            catch (e) {
                setRecentSearches([]);
            }
        })();
    }, []);
    const saveRecentSearches = async (list) => {
        setRecentSearches(list);
        try {
            await window.storage.set("recent-searches", JSON.stringify(list), false);
        }
        catch (e) { }
    };
    const addRecentSearch = (term) => {
        if (!term.trim())
            return;
        saveRecentSearches([term, ...recentSearches.filter((t) => t !== term)].slice(0, 10));
    };
    const removeRecentSearch = (term) => saveRecentSearches(recentSearches.filter((t) => t !== term));
    const clearRecentSearches = () => saveRecentSearches([]);
    const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(""), 1000); };
    const addToCart = (productId, qty = 1) => {
        setCart((prev) => {
            const existing = prev.find((c) => c.productId === productId);
            if (existing)
                return prev.map((c) => (c.productId === productId ? { ...c, qty: c.qty + qty } : c));
            return [...prev, { productId, qty }];
        });
        showToast("장바구니에 담았어요");
    };
    const addManualItem = (name, price, qty) => {
        const id = `manual-${Date.now()}-${Math.floor(Math.random() * 1000)}`;
        setCart((prev) => [...prev, { productId: id, qty, manual: { name, price } }]);
        showToast("장바구니에 담았어요");
    };
    const removeFromCart = (productId) => setCart((prev) => prev.filter((c) => c.productId !== productId));
    const changeQty = (productId, delta) => setCart((prev) => prev.map((c) => (c.productId === productId ? { ...c, qty: Math.max(1, c.qty + delta) } : c)));
    const toggleWishlist = (productId) => setWishlist((prev) => (prev.includes(productId) ? prev.filter((id) => id !== productId) : [...prev, productId]));
    const cartItems = cart.map((c) => ({ ...c, product: c.manual ? { id: c.productId, name: c.manual.name, price: c.manual.price, categoryName: "직접 추가", Icon: Package } : ALL_PRODUCTS.find((p) => p.id === c.productId) })).filter((c) => c.product);
    const cartTotal = cartItems.reduce((s, c) => s + c.product.price * c.qty, 0);
    const cartCount = cartItems.reduce((s, c) => s + c.qty, 0);
    const openProduct = (productId) => go({ screen: "productDetail", productId });
    const adCountToday = adWatch.day === todayKeyOf(nowTick) ? adWatch.count : 0;
    const completeAd = () => {
        const day = todayKeyOf(Date.now());
        const c = (adWatch.day === day ? adWatch.count : 0) + 1;
        setAdWatch({ day, count: c });
        setPoints((p) => p + AD_REWARD);
        pushNotif(`광고를 시청하고 ${AD_REWARD}포인트를 받았어요. (오늘 ${c}/${AD_DAILY_LIMIT}회)`, "point");
    };
    const todayPayCount = savingsHistory.filter((h) => h.ts && todayKeyOf(h.ts) === todayKeyOf(nowTick)).length;
    const payLimitReached = todayPayCount >= DAILY_PAY_LIMIT;
    const calcEarn = (total) => {
        const raw = Math.floor(total * POINT_RATE);
        const got = earnedToday.day === todayKeyOf(nowTick) ? earnedToday.amt : 0;
        const add = Math.max(0, Math.min(raw, POINT_CAP - got));
        return { raw, add, capped: raw > 0 && add < raw };
    };
    const expectedEarn = payLimitReached ? { raw: 0, add: 0, capped: false } : calcEarn(cartTotal);
    const buyAvatarItem = (key, idx, mode) => {
        const price = priceOf(key)[mode === "own" ? "own" : "rent"];
        if (points < price)
            return false;
        setPoints((p) => p - price);
        setAvatarItems((prev) => ({ ...prev, [`${key}:${idx}`]: mode === "own" ? { t: "own" } : { t: "rent", until: Date.now() + RENT_MS } }));
        const ci = AV_CATS.findIndex((c) => c.key === key);
        pushNotif(`${AV_CATS[ci].names[idx]} 아이템을 ${mode === "own" ? "소장했어요" : "12시간 대여했어요"}. (-${price}포인트)`, "point");
        return true;
    };
    const confirmPayment = () => {
        if (payLimitReached) {
            showToast("오늘 결제 가능 횟수를 모두 사용했어요");
            return;
        }
        const now = new Date();
        setSavingsHistory((prev) => [{ ts: now.getTime(), date: `${now.getMonth() + 1}월 ${now.getDate()}일`, time: fmtTime(now), amount: cartTotal, cats: cartItems.map((c) => c.product.categoryName), items: cartItems.map((c) => ({ name: c.product.name, qty: c.qty, price: c.product.price, cat: c.product.categoryName })) }, ...prev]);
        setLastSaved(cartTotal);
        pushNotif(`${won(cartTotal)}이 저축되었습니다.`, "save");
        try {
            const fp = footprintOf([{ amount: cartTotal, items: cartItems.map((c) => ({ name: c.product.name, qty: c.qty, price: c.product.price, cat: c.product.categoryName })) }]);
            pushNotif(`실제로 구매했다면 약 ${fmtKg(fp.total)} CO₂e가 배출되었을 거예요. 이번 저축으로 그만큼 줄였어요.`, "info");
        }
        catch (e) { }
        {
            const dayKey = todayKeyOf(Date.now());
            const earn = Math.floor(cartTotal * POINT_RATE);
            const got = earnedToday.day === dayKey ? earnedToday.amt : 0;
            const add = Math.max(0, Math.min(earn, POINT_CAP - got));
            setLastEarned({ add, note: earn > 0 && add < earn ? "오늘 적립 한도 적용" : "" });
            if (add > 0) {
                setPoints((p) => p + add);
                setEarnedToday({ day: dayKey, amt: got + add });
                pushNotif(`${add}포인트가 적립되었습니다. (오늘 ${got + add}/${POINT_CAP}포인트)`, "point");
                if (add < earn)
                    pushNotif(`오늘 포인트 적립 한도(${POINT_CAP}포인트)에 도달했어요.`, "point");
            }
            else if (earn > 0) {
                pushNotif(`오늘 포인트 적립 한도(${POINT_CAP}포인트)에 도달해 적립되지 않았어요.`, "point");
            }
        }
        if (goalAmount > 0) {
            const before = (goalCurrent / goalAmount) * 100, after = ((goalCurrent + cartTotal) / goalAmount) * 100;
            [25, 50, 80, 100].forEach((t) => { if (before < t && after >= t)
                pushNotif(`목표 금액의 ${t}%를 달성하였습니다.${t === 100 ? " 축하해요!" : ""}`, "goal"); });
        }
        setGoalCurrent((g) => g + cartTotal);
        setCart([]);
        go("delivery");
    };
    const applyGoal = (name, amount) => {
        const firstSet = !goalName && !goalAmount;
        if (name !== goalName)
            pushNotif(`목표가 ${name}${euro(name)} ${firstSet ? "설정" : "변경"}되었습니다.`, "goal");
        if (amount !== goalAmount)
            pushNotif(`목표 금액이 ${won(amount)}${euro(won(amount))} ${firstSet ? "설정" : "변경"}되었습니다.`, "goal");
        setGoalName(name);
        setGoalAmount(amount);
    };
    const renameUser = (n) => { if (n !== userName) {
        setUserName(n);
        pushNotif(`이름이 ${n}님으로 변경되었습니다.`, "info");
    } };
    const setWA = (fn) => setWithdrawAccounts((p) => normalizePrimary(typeof fn === "function" ? fn(p) : fn));
    const setDA = (fn) => setDepositAccounts((p) => normalizePrimary(typeof fn === "function" ? fn(p) : fn));
    // NOTE: window.confirm() is blocked/ignored inside sandboxed artifact iframes,
    // which silently returned false and made the old reset button do nothing.
    // A real in-app modal (ConfirmModal) replaces it below.
    const [showResetConfirm, setShowResetConfirm] = useState(false);
    const requestReset = () => setShowResetConfirm(true);
    const performReset = () => {
        // deep-clone defaults so the seed data itself is never mutated by later use
        const freshHistory = DEFAULTS.savingsHistory.map((h) => ({ ...h }));
        setCart([]);
        setWishlist([]);
        setToast("");
        setAddress({ name: "", phone: "", addr: "", request: "", requestCustom: "" });
        setPayMethod("account");
        setSavingsHistory(freshHistory);
        setLastSaved(0);
        setUserName(DEFAULTS.userName);
        setGoalName(DEFAULTS.goalName);
        setGoalAmount(DEFAULTS.goalAmount);
        setGoalCurrent(DEFAULTS.goalCurrent);
        setWithdrawAccounts([]);
        setDepositAccounts([]);
        setNotifications([]);
        setProfile(null);
        setPoints(0);
        setAdWatch({ day: "", count: 0 });
        setLastEarned({ add: 0, note: "" });
        setEarnedToday({ day: "", amt: 0 });
        setAvatarItems({});
        setSearchQuery("");
        setSearchInput("");
        setSearchSubmitted(false);
        clearRecentSearches();
        setShowResetConfirm(false);
        goRoot("home");
        showToast("체험 데이터를 초기화했어요");
    };
    const runSearch = (term) => { setSearchQuery(term); setSearchSubmitted(true); addRecentSearch(term); };
    const searchResults = useMemo(() => {
        if (!searchQuery.trim())
            return [];
        const q = searchQuery.trim().toLowerCase();
        return ALL_PRODUCTS.filter((p) => p.name.toLowerCase().includes(q));
    }, [searchQuery]);
    let body;
    switch (screen) {
        case "splash":
            body = React.createElement(SplashScreen, null);
            break;
        case "home":
            body = React.createElement(HomeScreen, { go: go, goRoot: goRoot, cartCount: cartCount, topCat: topCategoryOf(savingsHistory), totalSavings: monthTotalOf(savingsHistory), todaySavings: todaySavings, goalName: goalName, goalAmount: goalAmount, goalCurrent: goalCurrent });
            break;
        case "category":
            body = React.createElement(CategoryScreen, { categoryId: current.categoryId, goBack: goBack, goRoot: goRoot, openProduct: openProduct, cartCount: cartCount, nav: nav });
            break;
        case "productDetail":
            body = React.createElement(ProductDetailScreen, { productId: current.productId, wishlist: wishlist, toggleWishlist: toggleWishlist, addToCart: addToCart, goBack: goBack, goRoot: goRoot, cartCount: cartCount, nav: nav });
            break;
        case "wishlist":
            body = React.createElement(WishlistScreen, { wishlist: wishlist, openProduct: openProduct, goRoot: goRoot, cartCount: cartCount });
            break;
        case "cart":
            body = React.createElement(CartScreen, { expectedPts: expectedEarn.add, pointCapped: expectedEarn.capped, payLimitReached: payLimitReached, addManualItem: addManualItem, withdrawPrimary: withdrawAccounts.find((a) => a.primary) || null, depositPrimary: depositAccounts.find((a) => a.primary) || null, cartItems: cartItems, cartTotal: cartTotal, changeQty: changeQty, removeFromCart: removeFromCart, goRoot: goRoot, go: go, cartCount: cartCount });
            break;
        case "addressInput":
            body = React.createElement(AddressInputScreen, { payLimitReached: payLimitReached, withdrawPrimary: withdrawAccounts.find((a) => a.primary) || null, depositPrimary: depositAccounts.find((a) => a.primary) || null, address: address, setAddress: setAddress, payMethod: payMethod, setPayMethod: setPayMethod, go: go, goBack: goBack, cartCount: cartCount, goRoot: goRoot });
            break;
        case "orderConfirm":
            body = React.createElement(OrderConfirmScreen, { expectedPts: expectedEarn.add, pointCapped: expectedEarn.capped, payLimitReached: payLimitReached, withdrawPrimary: withdrawAccounts.find((a) => a.primary) || null, depositPrimary: depositAccounts.find((a) => a.primary) || null, cartItems: cartItems, cartTotal: cartTotal, address: address, payMethod: payMethod, confirmPayment: confirmPayment, goBack: goBack, cartCount: cartCount, goRoot: goRoot });
            break;
        case "delivery":
            body = React.createElement(DeliveryScreen, { go: go, cartCount: cartCount, goRoot: goRoot });
            break;
        case "deliveryComplete":
            body = React.createElement(DeliveryCompleteScreen, { lastEarned: lastEarned, points: points, go: go, cartCount: cartCount, goRoot: goRoot });
            break;
        case "savingsComplete":
            body = React.createElement(SavingsCompleteScreen, { lastSaved: lastSaved, totalSavings: totalSavings, goalCurrent: goalCurrent, goalAmount: goalAmount, savingsHistoryLen: savingsHistory.length, go: go, goRoot: goRoot, cartCount: cartCount });
            break;
        case "report":
        case "consumptionReport":
            body = React.createElement(ConsumptionReportScreen, { lastSaved: lastSaved, totalSavings: totalSavings, savingsHistory: savingsHistory, go: go, goRoot: goRoot, cartCount: cartCount });
            break;
        case "carbonReport":
            body = React.createElement(CarbonReportScreen, { savingsHistory: savingsHistory, goRoot: goRoot, cartCount: cartCount });
            break;
        case "goalEdit":
            body = React.createElement(GoalEditScreen, { goalName: goalName, goalAmount: goalAmount, applyGoal: applyGoal, goBack: goBack, cartCount: cartCount, goRoot: goRoot });
            break;
        case "my":
            body = React.createElement(MyScreen, { profile: sanitizeAvatar(profile, avatarItems, nowTick), userName: userName, setUserName: renameUser, level: level, totalSavings: totalSavings, savingsHistory: savingsHistory, goalCurrent: goalCurrent, goalAmount: goalAmount, goalName: goalName, go: go, goRoot: goRoot, resetAll: requestReset, cartCount: cartCount });
            break;
        case "accountManage":
            body = React.createElement(AccountManageScreen, { go: go, goBack: goBack, goRoot: goRoot, cartCount: cartCount, withdrawCount: withdrawAccounts.length, depositCount: depositAccounts.length });
            break;
        case "withdrawAccounts":
            body = React.createElement(AccountListScreen, { kind: "withdraw", accounts: withdrawAccounts, setAccounts: setWA, go: go, goBack: goBack, goRoot: goRoot, cartCount: cartCount });
            break;
        case "depositAccounts":
            body = React.createElement(AccountListScreen, { kind: "deposit", accounts: depositAccounts, setAccounts: setDA, go: go, goBack: goBack, goRoot: goRoot, cartCount: cartCount });
            break;
        case "addAccount":
            body = React.createElement(AddAccountScreen, { key: current.kind, kind: current.kind, accounts: current.kind === "withdraw" ? withdrawAccounts : depositAccounts, setAccounts: current.kind === "withdraw" ? setWA : setDA, goBack: goBack, goRoot: goRoot, cartCount: cartCount });
            break;
        case "createSavings":
            body = React.createElement(CreateSavingsScreen, { setDepositAccounts: setDA, goBack: goBack, goRoot: goRoot, cartCount: cartCount, showToast: showToast });
            break;
        case "notifications":
            body = React.createElement(NotificationsScreen, { goBack: goBack, goRoot: goRoot, cartCount: cartCount });
            break;
        case "avatarEdit":
            body = React.createElement(AvatarCustomizeScreen, { points: points, avatarItems: avatarItems, now: nowTick, onBuy: buyAvatarItem, profile: profile, onSave: (cfg) => { setProfile(cfg); pushNotif("프로필이 저장되었습니다.", "info"); showToast("프로필이 저장되었어요"); goBack(); }, goBack: goBack, goRoot: goRoot, cartCount: cartCount });
            break;
        case "savingsHistory":
            body = React.createElement(SavingsHistoryScreen, { savingsHistory: savingsHistory, goBack: goBack, goRoot: goRoot, cartCount: cartCount });
            break;
        case "search":
            body = React.createElement(SearchScreen, { searchInput: searchInput, setSearchInput: setSearchInput, searchQuery: searchQuery, searchSubmitted: searchSubmitted, setSearchSubmitted: setSearchSubmitted, searchResults: searchResults, recentSearches: recentSearches, runSearch: runSearch, clearRecentSearches: clearRecentSearches, removeRecentSearch: removeRecentSearch, openProduct: openProduct, goBack: goBack });
            break;
        default:
            body = React.createElement(HomeScreen, { go: go, goRoot: goRoot, cartCount: cartCount, topCat: topCategoryOf(savingsHistory), totalSavings: monthTotalOf(savingsHistory), todaySavings: todaySavings, goalName: goalName, goalAmount: goalAmount, goalCurrent: goalCurrent });
    }
    return (React.createElement(AppCtx.Provider, { value: { openAd: () => setAdOpen(true), points, unread, notifications, notify: pushNotif, markAllRead, openNotifications: () => go("notifications") } },
        React.createElement("div", { className: "w-full h-screen flex items-center justify-center", style: { background: "#DADFE2" } },
            React.createElement("style", null, `
        * { word-break: keep-all; overflow-wrap: break-word; }
      `),
            React.createElement("div", { className: "relative w-full max-w-[430px] h-full sm:h-[880px] sm:rounded-[36px] overflow-hidden shadow-2xl", style: { background: C.bg } },
                React.createElement(Toast, { message: toast }),
                React.createElement(AdModal, { open: adOpen, onClose: () => setAdOpen(false), count: adCountToday, onComplete: completeAd }),
                React.createElement(ConfirmModal, { open: showResetConfirm, title: "\uCCB4\uD5D8 \uB370\uC774\uD130\uB97C \uCD08\uAE30\uD654\uD560\uAE4C\uC694?", description: "\uC9C0\uAE08\uAE4C\uC9C0 \uC313\uC778 \uC801\uAE08 \uB0B4\uC5ED, \uC7A5\uBC14\uAD6C\uB2C8, \uAD00\uC2EC\uC0C1\uD488, \uBC30\uC1A1\uC9C0, \uBAA9\uD45C, \uC774\uB984, \uAC80\uC0C9 \uAE30\uB85D \uB4F1 \uC870\uC791\uD558\uAC70\uB098 \uBCC0\uACBD\uD55C \uBAA8\uB4E0 \uB370\uC774\uD130\uAC00 \uCC98\uC74C \uC0C1\uD0DC\uB85C \uB418\uB3CC\uC544\uAC00\uC694.", confirmLabel: "\uCD08\uAE30\uD654", onConfirm: performReset, onCancel: () => setShowResetConfirm(false) }),
                body))));
}
ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
